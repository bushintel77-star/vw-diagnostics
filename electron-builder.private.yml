# Private build: the public config plus the passkey-gated OpenPort driver
# bundle from resources/driver (prepared by scripts/set-driver-passkey.mjs).
# It carries Tactrix's installer — never publish or upload its output.
# Separate output folder so a public build can never pick it up.
extends: ./electron-builder.yml
directories:
  buildResources: build
  output: dist-private
extraResources:
  - from: resources/driver
    to: driver
    filter:
      - openport2_setup_1004341.exe
      - passkey.json
nsis:
  artifactName: vw-diagnostics-private-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
