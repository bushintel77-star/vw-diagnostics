appId: com.vwdiagnostics.app
productName: VW Diagnostics
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Test-only transport fixture (fake VIN/DTCs for CI selftest) — must never
  # ship inside the packaged app.
  - '!resources/sim_fixture.py'
  - '!tests/**'
  - '!scripts/**'
asarUnpack:
  - resources/**
win:
  executableName: vw-diagnostics
  icon: build/icon.ico
  # Workaround: this machine cannot create symlinks (no Developer Mode / non-admin),
  # which makes electron-builder's bundled winCodeSign extraction fail. Editing is
  # done post-build by scripts/edit-exe.mjs using build/tools/rcedit-x64.exe instead.
  # Remove this line once Windows Developer Mode is enabled.
  signAndEditExecutable: false
nsis:
  artifactName: vw-diagnostics-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: bushintel77-star
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
